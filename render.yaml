# Render Blueprint: one free web service that builds the web app and serves it
# with the API from a single Node process. Data is in memory and reseeded on
# every start, so a free instance spinning down after idle loses nothing.
services:
  - type: web
    name: member-lab
    runtime: node
    plan: free
    # npm ci installs dev dependencies too: the server runs through tsx.
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
