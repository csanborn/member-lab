# Render Blueprint: one always-on Starter web service that builds the web app and serves it
# with the API from a single Node process. Data is in memory and reseeded on
# every start, so a restart or redeploy loses nothing that matters.
services:
  - type: web
    name: member-lab
    runtime: node
    plan: starter
    # npm ci installs dev dependencies too: the server runs through tsx.
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
